[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evo_downloader"
version = "1.0.8"
description = "Python downloading library that enhances your download speed"
readme = "README.md"
license = "MIT"
authors = [
    { name = "maycuatroi" }
]
keywords = ["downloader", "cli", "parallel", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "requests",
    "rich",
    "click",
    "humanize",
    "types-requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
gui = [
    "pyqt5",
    "pytest-qt",
]

[project.scripts]
edownload = "evo_downloader.__main__:main"

[project.urls]
Homepage = "https://github.com/maycuatroi1/evo_downloader"
Repository = "https://github.com/maycuatroi1/evo_downloader"
Issues = "https://github.com/maycuatroi1/evo_downloader/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/evo_downloader",
    "/README.md",
    "/LICENSE",
    "/HISTORY.md",
]

[tool.hatch.build.targets.wheel]
packages = ["evo_downloader"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests/test_libs"]
addopts = "--ignore=tests/test_libs/test_cli.py --ignore=tests/test_libs/test_downloader.py"
